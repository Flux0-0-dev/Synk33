name: Release

env:
  GODOT_VERSION: 4.5.1
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build .NET project
        run: dotnet build ./src/*.csproj

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true

      - name: Import project (may crash but imports assets)
        continue-on-error: true
        run: |
          godot --headless --path ./src --import --quit || true

      - name: Export Linux
        run: |
          mkdir -p ./src/builds/linux
          godot --headless --path ./src --export-release linux_release ./builds/linux/linux_release.x86_64 || true
          if [ ! -f ./src/builds/linux/linux_release.x86_64 ]; then
            echo "ERROR: Linux export failed - binary not found"
            exit 1
          fi
          echo "✓ Linux export successful"

      - name: Export Windows
        run: |
          mkdir -p ./src/builds/windows
          godot --headless --path ./src --export-release windows ./builds/windows/windows_release.x86_64.exe || true
          if [ ! -f ./src/builds/windows/windows_release.x86_64.exe ]; then
            echo "ERROR: Windows export failed - binary not found"
            exit 1
          fi
          echo "✓ Windows export successful"

      - name: Archive exports
        run: |
          cd ./src/builds/linux && zip -r ../linux_release.zip . && cd ../../..
          cd ./src/builds/windows && zip -r ../windows_release.zip . && cd ../../..

      - name: Show build directory
        run: ls -R ./src/builds/

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          artifacts: ./src/builds/*.zip
          allowUpdates: true

      - name: Make get_butler.sh executable
        run: chmod +x ./get_butler.sh

      - name: Deploy to itch.io
        run: |
          ./get_butler.sh
          BUTLER_API_KEY=${{ secrets.BUTLER_API_KEY }} ./butler --verbose push \
            ./src/builds/linux_release.zip \
            "${{ vars.ITCHIO_USERNAME }}/${{ vars.ITCHIO_GAME }}:linux"
          BUTLER_API_KEY=${{ secrets.BUTLER_API_KEY }} ./butler --verbose push \
            ./src/builds/windows_release.zip \
            "${{ vars.ITCHIO_USERNAME }}/${{ vars.ITCHIO_GAME }}:windows"

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        uses: Ilshidur/action-discord@master
        with:
          args: '${{ vars.GAME_NAME }} ${{ github.ref_name }} released: https://${{ vars.ITCHIO_USERNAME }}.itch.io/${{ vars.ITCHIO_GAME }} Password: 100devs'
